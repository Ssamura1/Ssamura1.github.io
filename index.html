<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Опрос с фото</title>
</head>
<body>
    <h1>📸 Участие в опросе</h1>
    <p>Сделайте фото для подтверждения участия</p>
    <video id="video" autoplay playsinline style="width:100%;max-width:400px;border-radius:16px;background:#000;"></video>
    <br>
    <button onclick="startCamera()" style="margin-top:16px;padding:12px 32px;border:none;border-radius:12px;background:#6c5ce7;color:#fff;font-weight:bold;cursor:pointer;">📷 Включить камеру</button>
    <button onclick="takePhoto()" id="snapBtn" disabled style="margin-top:10px;padding:12px 32px;border:none;border-radius:12px;background:#00d2ff;color:#fff;font-weight:bold;cursor:pointer;">📸 Сделать фото</button>
    <div id="status" style="margin-top:16px;color:#8899bb;"></div>

    <script>
        const video = document.getElementById('video');
        const snapBtn = document.getElementById('snapBtn');
        const status = document.getElementById('status');
        let stream = null;

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(s => { stream = s; video.srcObject = s; snapBtn.disabled = false; status.textContent = '✅ Камера готова'; })
                .catch(() => status.textContent = '❌ Доступ к камере запрещён');
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const link = document.createElement('a');
            link.download = 'photo.jpg';
            link.href = canvas.toDataURL('image/jpeg');
            link.click();
            status.textContent = '✅ Фото сохранено!';
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            snapBtn.disabled = true;
        }
    </script>
</body>
</html>
